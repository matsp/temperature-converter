<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Temperature converter — direction B: Weather map</title>
<style>
@font-face { font-family: "Barlow"; src: url("../fonts/Barlow-Medium.ttf") format("truetype"); font-weight: 500; }
@font-face { font-family: "Barlow"; src: url("../fonts/Barlow-SemiBold.ttf") format("truetype"); font-weight: 600; }
@font-face { font-family: "Barlow Condensed"; src: url("../fonts/BarlowCondensed-Bold.ttf") format("truetype"); font-weight: 700; }
:root {
  /* isotherm ramp, one band per 10 °C, as on a forecast map */
  --t-m40: #3b2a7a; --t-m30: #4a3f9e; --t-m20: #3f62c4; --t-m10: #4a8fd6; --t-0: #7cc3e0;
  --t-10: #a8d98a; --t-20: #f2d34f; --t-30: #f29a3a; --t-40: #e0542e; --t-50: #a8232a;
  --ground: var(--t-20);           /* set live from the Celsius value */
  --ink: #1d1606;
  --ink-2: #4a3a10;
  --sans: "Barlow", system-ui, sans-serif;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html { font: 500 16px/1.5 var(--sans); color: var(--ink); }
body { min-height: 100vh; background: var(--ground); display: grid; grid-template-rows: auto 1fr auto; }
::selection { background: var(--ink); color: var(--ground); }
header { display: flex; justify-content: space-between; align-items: baseline; padding: 32px 56px 0; }
header h1 { font: 600 20px/1 var(--sans); letter-spacing: 0.01em; }
header p { font-size: 15px; color: var(--ink-2); }
main { display: grid; grid-template-columns: repeat(3, 1fr); align-content: center; gap: 0; padding: 0 56px; }
.field { padding: 24px 32px 28px; border-left: 2px solid rgba(29, 22, 6, 0.28); }
.field:first-child { border-left: 0; padding-left: 0; }
.field label { display: block; font: 600 15px/1 var(--sans); text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-2); margin-bottom: 10px; }
.row { display: flex; align-items: baseline; gap: 8px; }
.field input {
  width: 100%; min-width: 0; border: 0; background: transparent; color: var(--ink);
  font: 700 136px/0.95 var(--display); font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
  border-bottom: 3px solid rgba(29, 22, 6, 0.28); padding: 0 0 6px; caret-color: var(--ink);
}
.field input:focus { outline: none; border-bottom-color: var(--ink); }
.field .sym { font: 700 44px/1 var(--display); color: var(--ink-2); }
.legend { padding: 0 56px 40px; }
.legend ol { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(10, 1fr); border: 2px solid var(--ink); }
.legend li { height: 28px; position: relative; }
.legend li span { position: absolute; top: 34px; left: -1px; font: 600 13px/1 var(--sans); font-variant-numeric: tabular-nums; color: var(--ink-2); }
.legend .marker { position: relative; height: 0; }
.legend .marker b { position: absolute; left: calc((24 + 40) / 100 * 100%); top: -42px; transform: translateX(-50%); width: 4px; height: 44px; background: var(--ink); }
.legend .marker i { position: absolute; left: calc((24 + 40) / 100 * 100%); top: -66px; transform: translateX(-50%); font: 600 14px/1 var(--sans); font-style: normal; white-space: nowrap; }
.legend p { margin-top: 44px; font-size: 13px; color: var(--ink-2); }
</style>
</head>
<body style="--ground: var(--t-20)">
<header>
  <h1>Temperature converter</h1>
  <p>Type in any field. The page takes the colour of the temperature.</p>
</header>
<main>
  <div class="field"><label for="c">Celsius</label><div class="row"><input id="c" inputmode="decimal" value="24"><span class="sym">°C</span></div></div>
  <div class="field"><label for="f">Fahrenheit</label><div class="row"><input id="f" inputmode="decimal" value="75.2"><span class="sym">°F</span></div></div>
  <div class="field"><label for="k">Kelvin</label><div class="row"><input id="k" inputmode="decimal" value="297.15"><span class="sym">K</span></div></div>
</main>
<div class="legend" aria-hidden="true">
  <div class="marker"><i>24 °C</i><b></b></div>
  <ol>
    <li style="background:var(--t-m40)"><span>−40</span></li><li style="background:var(--t-m30)"><span>−30</span></li>
    <li style="background:var(--t-m20)"><span>−20</span></li><li style="background:var(--t-m10)"><span>−10</span></li>
    <li style="background:var(--t-0)"><span>0</span></li><li style="background:var(--t-10)"><span>10</span></li>
    <li style="background:var(--t-20)"><span>20</span></li><li style="background:var(--t-30)"><span>30</span></li>
    <li style="background:var(--t-40)"><span>40</span></li><li style="background:var(--t-50)"><span>50 °C</span></li>
  </ol>
</div>
</body>
</html>
