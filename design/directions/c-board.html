<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Temperature converter — direction C: Departure board</title>
<style>
@font-face { font-family: "Archivo"; src: url("../fonts/Archivo.ttf") format("truetype"); font-weight: 100 900; font-stretch: 62% 125%; }
:root {
  --steel: #2b2e31;     /* board frame */
  --steel-2: #3a3e42;
  --flap: #141516;      /* matte flap face */
  --flap-split: #000;
  --paint: #f1efe8;     /* flap letters */
  --paint-2: #9a9890;
  --lamp: #f2a516;      /* amber row lamp */
  --sans: "Archivo", system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html { background: var(--steel); color: var(--paint); font: 400 16px/1.5 var(--sans); }
::selection { background: var(--lamp); color: #1a1205; }
body { min-height: 100vh; display: grid; place-items: center; padding: 48px; }
.board { width: min(1180px, 100%); background: #0c0d0e; border: 1px solid #50555a; border-radius: 6px; padding: 28px 36px 32px; box-shadow: 0 24px 60px rgba(0,0,0,0.45), 0 2px 0 #4a4f54 inset; }
.board header { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 18px; border-bottom: 1px solid #2c2f32; }
.board h1 { font: 700 22px/1 var(--sans); font-stretch: 75%; letter-spacing: 0.08em; text-transform: uppercase; }
.board header p { font: 500 14px/1 var(--sans); color: var(--paint-2); }
.row { display: grid; grid-template-columns: 300px 1fr 120px; align-items: center; gap: 24px; padding: 22px 0; border-bottom: 1px solid #2c2f32; }
.row label { font: 700 30px/1 var(--sans); font-stretch: 70%; letter-spacing: 0.06em; text-transform: uppercase; display: flex; align-items: center; gap: 14px; }
.lamp { width: 12px; height: 12px; border-radius: 50%; background: #2a2b2c; flex: none; }
.row.is-warn .lamp { background: var(--lamp); box-shadow: 0 0 0 3px rgba(242,165,22,0.18); }
.cells { display: flex; gap: 6px; }
.cells span {
  width: 64px; height: 92px; display: grid; place-items: center; border-radius: 4px;
  background: linear-gradient(var(--flap) 0 49.4%, var(--flap-split) 49.4% 50.6%, #191a1c 50.6%);
  font: 700 70px/1 var(--sans); font-stretch: 72%; font-variant-numeric: tabular-nums;
}
.cells span:empty { color: transparent; }
.row.is-active .cells span { outline: 2px solid var(--lamp); outline-offset: 0; }
.row.is-active .cells span:last-child { outline-style: solid; }
.unit { font: 700 44px/1 var(--sans); font-stretch: 72%; color: var(--paint-2); }
.status { display: flex; align-items: center; gap: 12px; padding-top: 20px; font: 600 16px/1 var(--sans); color: var(--lamp); letter-spacing: 0.04em; text-transform: uppercase; font-stretch: 85%; }
.status::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--lamp); }
</style>
</head>
<body>
<section class="board" aria-label="Temperature converter">
  <header><h1>Temperature converter</h1><p>Type in any row. The other rows flip to match.</p></header>
  <div class="row is-active is-warn"><label for="c"><i class="lamp"></i>Celsius</label>
    <div class="cells" id="c" role="textbox" aria-label="Celsius" tabindex="0"><span></span><span>−</span><span>2</span><span>8</span><span>0</span><span></span><span></span><span></span></div><span class="unit">°C</span></div>
  <div class="row is-warn"><label for="f"><i class="lamp"></i>Fahrenheit</label>
    <div class="cells"><span></span><span>−</span><span>4</span><span>7</span><span>2</span><span></span><span></span><span></span></div><span class="unit">°F</span></div>
  <div class="row is-warn"><label for="k"><i class="lamp"></i>Kelvin</label>
    <div class="cells"><span></span><span></span><span>−</span><span>6</span><span>.</span><span>8</span><span>5</span><span></span></div><span class="unit">K</span></div>
  <p class="status" role="status">Below absolute zero</p>
</section>
</body>
</html>
