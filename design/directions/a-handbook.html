<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Temperature converter — direction A: Reference table</title>
<style>
@font-face { font-family: "Source Serif 4"; src: url("../fonts/SourceSerif4.ttf") format("truetype"); font-weight: 200 900; }
@font-face { font-family: "Public Sans"; src: url("../fonts/PublicSans.ttf") format("truetype"); font-weight: 100 900; }
:root {
  --cloth: #1f3a30;      /* handbook binding */
  --cloth-ink: #e9efe9;
  --paper: #f3f5f1;      /* cool, slightly green paper */
  --ink: #18201c;
  --ink-2: #4b5a52;
  --rule: #b9c4bc;
  --mark: #f2df4a;       /* highlighter */
  --mark-ink: #2a2606;
  --serif: "Source Serif 4", Georgia, serif;
  --sans: "Public Sans", system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html { background: var(--paper); color: var(--ink); font: 400 16px/1.5 var(--sans); }
::selection { background: var(--mark); color: var(--mark-ink); }
body { min-height: 100vh; }
.band { background: var(--cloth); color: var(--cloth-ink); }
.band__inner { max-width: 1120px; margin: 0 auto; padding: 28px 40px 26px; display: flex; align-items: baseline; justify-content: space-between; }
.band h1 { font: 600 28px/1.1 var(--serif); letter-spacing: -0.01em; }
.band p { font: 400 14px/1.4 var(--sans); color: #b7c7bd; }
main { max-width: 1120px; margin: 0 auto; padding: 56px 40px 64px; }
.grid { display: grid; grid-template-columns: 220px repeat(3, 1fr); }
.grid > * { border-bottom: 1px solid var(--rule); }
.head { font: 600 13px/1 var(--sans); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-2); padding: 0 0 14px; border-bottom: 1px solid var(--ink); }
.head--unit { padding-left: 24px; }
.entry-label { font: 400 15px/1.3 var(--sans); color: var(--ink-2); padding: 0; display: flex; align-items: center; border-bottom: 1px solid var(--ink); }
.field { position: relative; padding: 14px 24px 18px; border-left: 1px solid var(--rule); border-bottom: 1px solid var(--ink); }
.field input {
  width: 100%; border: 0; background: transparent; color: var(--ink);
  font: 500 64px/1.1 var(--serif); font-variant-numeric: lining-nums tabular-nums; letter-spacing: -0.02em;
  padding: 0 0 4px; border-bottom: 2px solid transparent; caret-color: var(--cloth);
}
.field input:focus { outline: none; border-bottom-color: var(--cloth); }
.field .sym { position: absolute; right: 24px; top: 26px; font: 400 22px/1 var(--serif); color: var(--ink-2); }
.notice { grid-column: 2 / -1; min-height: 0; font: 500 14px/1 var(--sans); }
h2 { font: 600 20px/1.2 var(--serif); margin: 56px 0 16px; }
.ref .name { padding: 13px 0; font: 400 15px/1.3 var(--sans); color: var(--ink); }
.ref .v { padding: 13px 24px; border-left: 1px solid var(--rule); font: 400 19px/1.3 var(--serif); font-variant-numeric: lining-nums tabular-nums; }
.ref .unit { color: var(--ink-2); font-size: 15px; margin-left: 4px; }
.ref.is-you > * { background: var(--mark); color: var(--mark-ink); border-bottom-color: #c9b52a; }
.ref.is-you .name { font-weight: 600; padding-left: 12px; }
.ref.is-you .unit { color: #5b5313; }
.ref { display: contents; }
</style>
</head>
<body>
<header class="band"><div class="band__inner">
  <h1>Temperature converter</h1>
  <p>Type in any field. The other two follow.</p>
</div></header>
<main>
  <div class="grid" role="group" aria-label="Convert">
    <div class="head">Value</div>
    <div class="head head--unit">Celsius</div>
    <div class="head head--unit">Fahrenheit</div>
    <div class="head head--unit">Kelvin</div>
    <label class="entry-label" for="c">Your temperature</label>
    <div class="field"><input id="c" inputmode="decimal" value="20" aria-label="Celsius"><span class="sym">°C</span></div>
    <div class="field"><input id="f" inputmode="decimal" value="68" aria-label="Fahrenheit"><span class="sym">°F</span></div>
    <div class="field"><input id="k" inputmode="decimal" value="293.15" aria-label="Kelvin"><span class="sym">K</span></div>
  </div>

  <h2>Where it sits</h2>
  <div class="grid" id="ref">
    <div class="ref"><div class="name">Absolute zero</div><div class="v">−273.15<span class="unit">°C</span></div><div class="v">−459.67<span class="unit">°F</span></div><div class="v">0<span class="unit">K</span></div></div>
    <div class="ref"><div class="name">Water freezes</div><div class="v">0<span class="unit">°C</span></div><div class="v">32<span class="unit">°F</span></div><div class="v">273.15<span class="unit">K</span></div></div>
    <div class="ref is-you"><div class="name">Your temperature</div><div class="v">20<span class="unit">°C</span></div><div class="v">68<span class="unit">°F</span></div><div class="v">293.15<span class="unit">K</span></div></div>
    <div class="ref"><div class="name">Body temperature</div><div class="v">37<span class="unit">°C</span></div><div class="v">98.6<span class="unit">°F</span></div><div class="v">310.15<span class="unit">K</span></div></div>
    <div class="ref"><div class="name">Water boils</div><div class="v">100<span class="unit">°C</span></div><div class="v">212<span class="unit">°F</span></div><div class="v">373.15<span class="unit">K</span></div></div>
  </div>
</main>
</body>
</html>
